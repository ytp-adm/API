steps:
  # Docker イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE_NAME-repo/$_SERVICE_NAME:$BUILD_ID', '.']
  
  # Docker イメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE_NAME-repo/$_SERVICE_NAME:$BUILD_ID']
  
  # Cloud Runにデプロイ
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE_NAME-repo/$_SERVICE_NAME:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_SERVICE_NAME-repo/$_SERVICE_NAME:$BUILD_ID'

# Cloud Buildの置換変数のデフォルト値を定義
substitutions:
  _SERVICE_NAME: seo-fastapi
  _REGION: asia-northeast1